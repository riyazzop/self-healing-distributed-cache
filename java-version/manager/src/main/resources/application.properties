server.port=3000
spring.application.name=cache-manager

spring.datasource.url=jdbc:postgresql://localhost:5432/postgress
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=your_super_secret_key_at_least_32_chars_long
jwt.expiration-days=30

nodes.node1.id=NODE-01
nodes.node1.port=3001
nodes.node2.id=NODE-02
nodes.node2.port=3002
nodes.node3.id=NODE-03
nodes.node3.port=3003

node.jar.path=${NODE_JAR_PATH:../node/target/node-1.0.0.jar}
node.ttl-seconds=0

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
